[workspace]
members = [
    "crates/anoti-app",
    "crates/anoti-core",
    "crates/anoti-delivery",
    "crates/anoti-hooks",
    "crates/anoti-platform",
    "crates/anoti-platform-linux",
    "crates/anoti-platform-windows",
]
default-members = ["crates/anoti-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sonnx24042005/ai-agent-desktop-notifier"

[workspace.dependencies]
anoti-core = { path = "crates/anoti-core" }
anoti-delivery = { path = "crates/anoti-delivery" }
anoti-hooks = { path = "crates/anoti-hooks" }
anoti-platform = { path = "crates/anoti-platform" }
anoti-platform-linux = { path = "crates/anoti-platform-linux" }
anoti-platform-windows = { path = "crates/anoti-platform-windows" }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
