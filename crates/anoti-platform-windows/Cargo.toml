[package]
name = "anoti-platform-windows"
description = "Windows native toast and audio notification backend for anoti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anoti-core.workspace = true
anoti-platform.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
