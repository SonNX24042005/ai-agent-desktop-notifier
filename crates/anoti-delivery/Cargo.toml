[package]
name = "anoti-delivery"
description = "Platform-neutral outbound delivery policy for anoti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anoti-core.workspace = true
serde_json.workspace = true
