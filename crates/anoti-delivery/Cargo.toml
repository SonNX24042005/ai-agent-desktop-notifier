[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
